[package]
name = "snowflake-bodies"
version = "0.1.0"
description = "Extract, parse, and check embedded Snowflake procedure and function bodies"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/meloncholera/tree-sitter-snowflake.git"
readme = "README.md"
include = ["/src/**", "/queries/**", "/README.md", "/LICENSE"]

[features]
default = []
java = ["dep:tree-sitter-java"]
scala = ["dep:tree-sitter-scala"]

[dependencies]
tree-sitter-snowflake = { version = "0.2.1", path = ".." }
tree-sitter = ">=0.26, <0.28"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-scala = { version = "0.26.2", optional = true }
