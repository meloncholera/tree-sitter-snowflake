# =============================================================================
#  tree-sitter-snowflake · GitHub Actions
# -----------------------------------------------------------------------------
#  File                verify.yml
#  Workflow name       Verify
#  Type                Entrypoint (runs in this repo only)
#  Triggers            pull_request
#                      push (dev, main)
#                      workflow_dispatch
#  Purpose             Regenerate the parser from grammar.js, fail on any
#                      drift in the generated parser or the committed
#                      node-kind snapshot, run the tree-sitter corpus and
#                      highlight tests, parse every fixture and fail on any
#                      ERROR/MISSING/zero-width node, assert the fixtures
#                      carry no source-corpus identifiers, probe both
#                      identifier slots for every keyword, build and test
#                      the Rust binding (against the tree-sitter version
#                      that is snowflake-bodies' declared floor, and
#                      against the latest), build and test the Node
#                      binding, validate the PR title, scan for secrets,
#                      and lint workflow/YAML files. A final aggregate job
#                      rolls every check up into a single `Verify` status
#                      for branch rulesets to require.
# =============================================================================

name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # A PR title/body edit must never cancel an in-flight run that is
  # actually building this head SHA — only a real new commit
  # (synchronize) or another non-edit trigger should preempt one.
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  # Bundles the changed-paths check with two other small, checkout-only
  # jobs (secret scanning, workflow/YAML linting) that each used to pay
  # their own per-job minute for a few seconds of work.
  changes:
    name: Changed paths, secret scanning, and workflow/YAML checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      build: ${{ steps.paths.outputs.build }}
      windows: ${{ steps.paths.outputs.windows }}
    env:
      GITLEAKS_VERSION: '8.30.1'
      ACTIONLINT_VERSION: '1.7.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Gitleaks
        id: cache-gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          asset="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tmp/$asset" "$base/$asset"
          curl -sSfL -o "$tmp/checksums.txt" "$base/gitleaks_${VERSION}_checksums.txt"
          ( cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum --check - )
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tmp/$asset" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" "$HOME/.local/bin/gitleaks"

      - name: Run Gitleaks
        id: scan
        run: $HOME/.local/bin/gitleaks detect --no-git --redact --source . --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Upload redacted secret scan report
        if: failure() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 3

      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-linux-amd64-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ env.ACTIONLINT_VERSION }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          asset="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tmp/$asset" "$base/$asset"
          curl -sSfL -o "$tmp/checksums.txt" "$base/actionlint_${VERSION}_checksums.txt"
          ( cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum --check - )
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tmp/$asset" -C "$tmp" actionlint
          install -m 0755 "$tmp/actionlint" "$HOME/.local/bin/actionlint"

      - name: Run actionlint
        run: $HOME/.local/bin/actionlint -color -ignore 'SC[0-9]+:(info|style):'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Test CI policy
        run: node --test tools/*.test.mjs tools/parse-rate/*.test.mjs

      - name: Validate YAML files
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PYEOF'
          import sys
          import yaml
          from pathlib import Path

          ignored = {".git", "node_modules", "target", "dist"}
          failures = []
          for path in Path(".").rglob("*.y*ml"):
              if any(part in ignored for part in path.parts):
                  continue
              try:
                  with path.open("r", encoding="utf-8") as f:
                      list(yaml.safe_load_all(f))
              except yaml.YAMLError as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("Invalid YAML found:")
              for failure in failures:
                  print(f"  {failure}")
              sys.exit(1)
          print("All YAML files parsed cleanly.")
          PYEOF

      # A pure title/body edit carries no new commit, so the head SHA is
      # unchanged from whatever run last built it. Before skipping the
      # build jobs for that reason, confirm THIS SHA's own most recent
      # completed `Verify` run actually succeeded — otherwise a prior
      # failed or still-running build for this exact commit would be
      # silently overwritten by a green "nothing to do" result.
      - name: Check this head SHA's most recent completed Verify run
        id: prior
        if: github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha }}"
          conclusion=$(gh api "repos/${{ github.repository }}/commits/${sha}/check-runs" --jq '[.check_runs[] | select(.name == "Verify" and .status == "completed")] | sort_by(.completed_at) | last | .conclusion // "none"')
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - id: paths
        env:
          PRIOR_VERIFIED: ${{ steps.prior.outputs.conclusion == 'success' }}
        run: node tools/ci-policy.mjs changes

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate conventional PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
            ci
            build
            security

  verify:
    name: Grammar, fixtures, Rust build/test
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0 rustc stable as of 2026-08-17 (action itself publishes no version tags)
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install the tree-sitter CLI
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli

      - name: Regenerate the parser from grammar.js
        run: npx --no-install tree-sitter generate

      - name: Fail if the generated parser is out of date
        run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json

      - name: Fail if the node-kind snapshot is out of date
        run: |
          git ls-files --error-unmatch test/node-kinds.txt
          node tools/node-kinds.mjs > test/node-kinds.txt
          git diff --exit-code -- test/node-kinds.txt

      - name: Run corpus and highlight tests
        run: npx --no-install tree-sitter test

      - name: Parse every fixture and fail on ERROR/MISSING or zero-width nodes
        run: node tools/fixture-check.mjs

      - name: Fail if any fixture carries a source-corpus identifier
        run: node tools/fixture-leak-grep.mjs

      - name: Probe both identifier slots for every keyword
        run: node tools/keyword-probe.mjs

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo build & test
        run: |
          cargo test --workspace
          cargo test -p snowflake-bodies --all-features

      - name: Verify package contents
        run: node tools/package-check.mjs

  consumer-pin:
    name: Rust build/test against tree-sitter 0.26 (snowflake-bodies' declared floor)
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0 rustc stable as of 2026-08-17 (action itself publishes no version tags)

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: consumer-pin

      # The dev-dependency tracks the latest tree-sitter, so the `verify`
      # job above covers the newest release. This job covers the other
      # end of the range: snowflake-bodies/Cargo.toml declares
      # `tree-sitter = ">=0.26, <0.28"`, and the generated parser's ABI
      # must stay one that floor accepts. cadence and marlin both moved to
      # `tree-sitter = "0.27"` (verified 2026-09-26), so 0.26 no longer
      # matches any consumer's own pin — this job now exists solely to
      # keep the companion's declared floor honest, not to track a
      # consumer. Edit the manifest in-job and test there. The
      # `^tree-sitter = ` anchor matches only the dev-dependency —
      # `tree-sitter-language` in [dependencies] has a different prefix.
      # Pin the companion's runtime dependency too, so its returned trees
      # use the same tree-sitter types as a build at that floor.
      - name: Pin tree-sitter to its declared floor and test
        run: |
          sed -i 's/^tree-sitter = .*/tree-sitter = "0.26"/' Cargo.toml
          sed -i 's/^tree-sitter = .*/tree-sitter = "0.26"/' snowflake-bodies/Cargo.toml
          grep 'tree-sitter = ' Cargo.toml snowflake-bodies/Cargo.toml
          cargo test --workspace --all-features

  node-binding:
    name: Node binding build/test
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.windows == 'true' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Install dependencies and build the native addon
        run: npm ci

      - name: Run the Node binding tests
        run: npm test

  ci:
    name: ${{ github.event_name == 'push' && 'Verify (push)' || 'Verify' }}
    needs: [changes, verify, consumer-pin, node-binding, pr-title]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Require successful jobs and only planned skips
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: node tools/ci-policy.mjs verify
