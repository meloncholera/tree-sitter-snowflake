# =============================================================================
#  tree-sitter-snowflake · GitHub Actions
# -----------------------------------------------------------------------------
#  File                release.yml
#  Workflow name       Release
#  Type                Entrypoint (runs in this repo only)
#  Triggers            push (tags: v*)
#                      workflow_dispatch (tag input)
#  Purpose             Publishes the crate to crates.io and the npm package
#                      to the public npm registry and to GitHub Packages for
#                      the given tag, then creates the corresponding GitHub
#                      Release. The tag must point at a commit on main whose
#                      Cargo.toml version matches it; the release policy
#                      script validates that before anything is published.
#                      GitHub Packages requires an npm package name scoped to
#                      the repository owner, so that job publishes under
#                      @<owner>/tree-sitter-snowflake in its own short-lived
#                      checkout only; the public npm package stays unscoped.
#                      Prebuilt native addons (Linux and Windows, Node-API)
#                      are built by the prebuild matrix job and published
#                      inside the npm and GitHub Packages tarballs, so an
#                      install on those platforms needs no C toolchain;
#                      node-gyp-build prefers a matching prebuild over a
#                      source build. A WASM build is attached to the GitHub
#                      Release for web-tree-sitter consumers, along with
#                      test/node-kinds.txt and versions.json as the node-kind
#                      stability surface (only the files the checkout has —
#                      an older tag re-dispatched by hand can predate them).
#
#                      The workflow_dispatch trigger exists because
#                      release-tag.yml pushes the tag using GITHUB_TOKEN, and
#                      GitHub never fires further workflow runs off a
#                      GITHUB_TOKEN-authored push; release-tag.yml dispatches
#                      this workflow with the tag it just pushed instead.
#
#                      Package versions (package.json, tree-sitter.json) are
#                      set from the tag at publish time in the working tree
#                      only, never committed back. Every publish step is safe
#                      to repeat: it checks whether the version is already
#                      live before publishing.
# =============================================================================

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  TREE_SITTER_CLI_VERSION: '0.27.0'
  PREBUILDIFY_VERSION: '6.0.1'

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      policy: ${{ steps.release.outputs.policy }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release validation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Resolve a release tag on main and check its Cargo version
        id: release
        run: |
          node tools/release-policy.mjs resolve
          cp tools/package-check.mjs "$RUNNER_TEMP/release-package-check.mjs"
      - name: Checkout the validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Regenerate the parser from grammar.js
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npx --no-install tree-sitter generate
      - name: Fail if the generated parser is out of date
        run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json
      - name: Run corpus and highlight tests
        run: npx --no-install tree-sitter test
      - name: Verify package contents
        run: node "$RUNNER_TEMP/release-package-check.mjs"
      - name: Cargo build & test
        run: cargo test

  prebuild:
    name: Prebuild native addon (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        # node-addon-api is a runtime dependency binding.gyp resolves at gyp
        # configure time (`require('node-addon-api').targets`); prebuildify
        # only installs itself into npx's own temporary cache, which that
        # require can't see. --ignore-scripts skips this package's own
        # "install": "node-gyp-build" script, which would otherwise try (and
        # fail, since there's nothing built yet) to load the addon.
        run: npm ci --ignore-scripts
      - name: Build the native Node addon prebuild
        run: npx --yes prebuildify@${{ env.PREBUILDIFY_VERSION }} --napi --strip
      - name: Upload the prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/
          if-no-files-found: error

  build-wasm:
    name: Build WASM
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      file: ${{ steps.wasm.outputs.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Build the WASM grammar
        run: npx --yes --package=tree-sitter-cli@${{ env.TREE_SITTER_CLI_VERSION }} -- tree-sitter build --wasm
      - name: Locate the WASM build
        id: wasm
        # The CLI names its output after the grammar's `name` in
        # tree-sitter.json, which need not match the package name.
        run: |
          set -euo pipefail
          name=$(node -p 'require("./tree-sitter.json").grammars[0].name')
          file="tree-sitter-${name}.wasm"
          test -f "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Upload the WASM build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-build
          path: ${{ steps.wasm.outputs.file }}
          if-no-files-found: error

  publish-crate:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Publish (skip if this version is already live)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "tree-sitter-snowflake-release (${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/tree-sitter-snowflake/${version}")
          if [ "$status" = "200" ]; then
            echo "tree-sitter-snowflake@${version} is already published, skipping"
          elif [ "$status" = "404" ]; then
            cargo publish -p tree-sitter-snowflake
          else
            echo "crates.io lookup failed with HTTP ${status}" >&2
            exit 1
          fi

  publish-npm:
    name: Publish to npm
    needs: [verify, prebuild]
    # A prebuild failure on one platform is not fatal: node-gyp-build falls
    # back to a source build where no matching prebuild exists. Waiting for
    # `prebuild` without hard-requiring every leg keeps that fallback instead
    # of blocking the publish on one platform's toolchain problem.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.policy }}
          path: .release-tools
          sparse-checkout: tools/release-policy.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org/
      - name: Download the prebuilt native addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - name: Set package version from tag
        id: package
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: node .release-tools/tools/release-policy.mjs prepare-npm
      - name: Publish (skip if this version is already live)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ steps.package.outputs.provenance }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "tree-sitter-snowflake@${version}" version >/dev/null 2>&1; then
            echo "tree-sitter-snowflake@${version} is already published, skipping"
          else
            npm publish --access public --provenance="$PROVENANCE"
          fi

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: [verify, prebuild]
    # A prebuild failure on one platform is not fatal: node-gyp-build falls
    # back to a source build where no matching prebuild exists. Waiting for
    # `prebuild` without hard-requiring every leg keeps that fallback instead
    # of blocking the publish on one platform's toolchain problem.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # GitHub Packages requires the scope to match the repository owner;
      # deriving it keeps an ownership transfer from needing a workflow edit.
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.policy }}
          path: .release-tools
          sparse-checkout: tools/release-policy.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - name: Download the prebuilt native addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - name: Set package name and version for GitHub Packages
        run: |
          set -euo pipefail
          npm pkg set "name=@${OWNER}/tree-sitter-snowflake"
          node .release-tools/tools/release-policy.mjs prepare-npm
      - name: Publish (skip if this version is already live)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "@${OWNER}/tree-sitter-snowflake@${version}" version >/dev/null 2>&1; then
            echo "@${OWNER}/tree-sitter-snowflake@${version} is already published, skipping"
          else
            npm publish --access public
          fi

  github-release:
    name: Create GitHub Release
    needs: [verify, publish-crate, publish-npm, publish-github-packages, build-wasm]
    # The release does not depend on the WASM build succeeding: a build-wasm
    # failure should not block release creation once every registry is live.
    # Only the three publish jobs are hard-required.
    if: ${{ !cancelled() && needs.publish-crate.result == 'success' && needs.publish-npm.result == 'success' && needs.publish-github-packages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Download the WASM build
        if: needs.build-wasm.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
      - name: Attach the WASM build
        if: needs.build-wasm.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WASM_FILE: ${{ needs.build-wasm.outputs.file }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$WASM_FILE" --clobber

      - name: Attach the node-kind stability surface
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A manual re-dispatch can target a tag cut before these files
          # existed; upload only what the checkout has, so a recovery run
          # against an old tag does not fail the whole job.
          assets=()
          for f in test/node-kinds.txt versions.json; do
            [ -f "$f" ] && assets+=("$f")
          done
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          fi
