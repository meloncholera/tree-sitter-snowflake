name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-plz:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@422f3094be6a0843857aa008b499caaf6bce0da8 # v1.24.0
      - name: Install release-plz
        run: cargo binstall release-plz@0.3.160 --force --strategies=crate-meta-data --no-confirm
      - name: Compute next version and changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: release-plz update --git-token "$GITHUB_TOKEN" --repo-url "https://github.com/${GITHUB_REPOSITORY}"
      - name: Push release branch and open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No unreleased changes — nothing to open a release PR for."
            exit 0
          fi
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="v${version}" node tools/release-policy.mjs prepare-npm
          branch="release-plz/release"
          git add -A
          git commit -m "chore(release): v${version}"
          git push origin "HEAD:${branch}" --force
          existing=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Release PR #${existing} already open for the ${branch} branch — updated in place."
          else
            gh pr create --base main --head "$branch" --title "chore(release): v${version}" --body "Automated version bump and CHANGELOG.md entry computed from Conventional Commits. Merge this once Verify passes to trigger the tag-and-publish sequence."
          fi
          gh workflow run verify.yml --ref "$branch"
