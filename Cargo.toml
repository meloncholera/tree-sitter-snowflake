[workspace]
members = ["snowflake-bodies"]
resolver = "3"

[package]
name = "tree-sitter-snowflake"
description = "Tree-sitter grammar for Snowflake SQL"
version = "0.1.1"
authors = ["M. Reifschneider"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "sql", "snowflake"]
categories = ["parsing", "parser-implementations", "text-editors"]
repository = "https://github.com/meloncholic/tree-sitter-snowflake.git"
edition = "2024"
rust-version = "1.85"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/grammar.js",
  "/grammar/**",
  "/bindings/rust/**",
  "/queries/**",
  "/src/**",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "~1.4.4"

[dev-dependencies]
# Tracks the newest tree-sitter release. This is a dev-dependency only —
# the published crate's runtime dependency is `tree-sitter-language`, so a
# consumer's own `tree-sitter` version is what governs at their end, not
# this line. The `consumer-pin` CI job covers the other direction by
# rebuilding against 0.26, snowflake-bodies' declared floor (cadence and
# marlin have both since moved to 0.27, so this no longer tracks either
# consumer's own pin).
#
# Note 0.27 itself requires Rust 1.90, above the `rust-version = "1.85"`
# declared above. That is not a contradiction: `rust-version` states what
# building the published library needs (edition 2024, and a lone
# `tree-sitter-language` runtime dependency), while running this repo's own
# test suite needs 1.90. Keeping the declared floor at the real library
# floor is what lets a consumer on an older toolchain still depend on this
# crate; raising it to 1.90 would exclude them for a dev-only reason.
tree-sitter = "0.27"
